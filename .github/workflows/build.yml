name: Shared build

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4
    # Arcanum module fixes 
    - name: Build Arcanum.PATCH8
      working-directory: modules/Arcanum
      # TODO: Figure out how to avoid packing dbmaker.exe as unlike DATBuilder it doesn't support paths remap
      run: |
        Copy-Item "../../utils/dbmaker.exe" "."
        & "./dbmaker.exe" -r Arcanum.PATCH8 *
    - name: Upload Arcanum.PATCH8
      uses: actions/upload-artifact@v4
      with:
        name: Arcanum.PATCH8
        path: modules/Arcanum/Arcanum.PATCH8
        if-no-files-found: error     
    # .proto fixes
    - name: Build Arcanum8.dat
      working-directory: data
      run: |
        Copy-Item "../utils/dbmaker.exe" "."
        & "./dbmaker.exe" -r Arcanum8.dat proto/*
    - name: Upload Arcanum8.dat
      uses: actions/upload-artifact@v4
      with:
        name: Arcanum8.dat
        path: data/Arcanum8.dat
        if-no-files-found: error        
    # engine fixes
    - name: Build engine fixes
      working-directory: engine
      run: |
        cargo build --workspace --release --verbose
        Rename-Item "target/i686-pc-windows-msvc/release/engine_fixes.dll" "engine_fixes.asi"
#   - name: Run tests
#     run: cargo test --verbose
    - name: Upload engine fixes
      uses: actions/upload-artifact@v4
      with:
        name: Engine
        path: |
          engine/target/i686-pc-windows-msvc/release/dinput.dll
          engine/target/i686-pc-windows-msvc/release/engine_fixes.asi
        if-no-files-found: error
