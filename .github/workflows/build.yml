name: Shared build

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4
    # Arcanum module fixes 
    - name: Build Arcanum.PATCH8
      working-directory: modules/Arcanum
      # Folders directly name to avoid packing dbmaker.exe itself (and dbmaker.exe has to be in that location as it doesn't support Remap Paths)
      run: |
        Copy-Item "../../utils/dbmaker.exe" "."
        & "./dbmaker.exe" -r Arcanum.PATCH8 dlg/* maps/* mes/* scr/* townmap/* 
    - name: Upload Arcanum.PATCH8
      uses: actions/upload-artifact@v4
      with:
        name: Arcanum.PATCH8
        path: modules/Arcanum/Arcanum.PATCH8
        if-no-files-found: error     
    # .proto fixes
    - name: Build Arcanum8.dat
      working-directory: data
      run: |
        Copy-Item "../utils/dbmaker.exe" "."
        & "./dbmaker.exe" -r Arcanum8.dat proto/*
    - name: Upload Arcanum8.dat
      uses: actions/upload-artifact@v4
      with:
        name: Arcanum8.dat
        path: data/Arcanum8.dat
        if-no-files-found: error        

    # TODO: engine fixes

