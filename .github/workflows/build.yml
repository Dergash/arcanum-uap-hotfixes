name: Shared build

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4
    # Arcanum module fixes 
    - name: Build Arcanum.PATCH8
      working-directory: modules/Arcanum
      # TODO: Figure out how to avoid packing dbmaker.exe as unlike DATBuilder it doesn't support paths remap
      run: |
        Copy-Item "../../utils/dbmaker.exe" "."
        & "./dbmaker.exe" -r Arcanum.PATCH8 *
    # .proto fixes
    - name: Build Arcanum8.dat
      working-directory: data
      run: |
        Copy-Item "../utils/dbmaker.exe" "."
        & "./dbmaker.exe" -r Arcanum8.dat *     
    #  grey area .proto fixes
    - name: Build Arcanum8.dat for Grey Legion
      working-directory: grey-legion/data
      run: |
        Copy-Item "../../utils/dbmaker.exe" "."
        & Copy-Item "../../data/*" "." -Recurse -Force
        & "./dbmaker.exe" -r Arcanum8.dat *
    # engine fixes
    - name: Build engine fixes
      working-directory: engine
      run: |
        cargo build --workspace --release --verbose
        Rename-Item "target/i686-pc-windows-msvc/release/engine_fixes.dll" "engine_fixes.asi"
    # upload artifacts (they will be packed differently depending on the build)
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: |
          modules/Arcanum/Arcanum.PATCH8
          data/Arcanum8.dat
          grey-legion/data/Arcanum8.dat
          engine/target/i686-pc-windows-msvc/release/dinput.dll
          engine/target/i686-pc-windows-msvc/release/engine_fixes.asi
        if-no-files-found: error
        retention-days: 1
